<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 대시보드</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
  <section id="login" class="login" hidden>
    <div class="card">
      <div class="logo big">AI</div>
      <h1>AI 대시보드</h1>
      <p class="sub">솝커톤 iOS 1조 · 역할을 선택하세요</p>
      <button class="btn big" id="login-dev">개발자 · GitHub로 로그인</button>
      <div class="or">또는</div>
      <input id="planner-name" maxlength="30" placeholder="기획자 이름 (예: 김기획)" autocomplete="name">
      <button class="btn big ghost" id="login-planner">기획자로 입장 (토큰 필요 없음)</button>
      <p class="error" id="login-error" role="alert"></p>
    </div>
  </section>

  <header class="top" id="top" hidden>
    <div class="brand">
      <div class="logo">AI</div>
      <div>
        <h1>Spec Center</h1>
        <p class="sub" id="repo"></p>
      </div>
    </div>
    <nav class="pills" id="tabs">
      <button data-tab="features" class="pill on">기능</button>
      <button data-tab="prd" class="pill">PRD</button>
      <button data-tab="guide" class="pill">사용법</button>
      <button id="reset" class="pill">필터 초기화</button>
      <span class="chip" id="who"></span>
      <button id="logout" class="pill">로그아웃</button>
    </nav>
  </header>

  <main id="app" hidden>
    <section id="view-features">
      <div class="stats" id="stats"></div>
      <div class="layout">
        <aside class="card side">
          <h2 class="cap">파이프라인 상태</h2>
          <ul class="pipe" id="pipe"></ul>
          <h2 class="cap">빠른 필터</h2>
          <div class="quick" id="quick"></div>
        </aside>
        <section class="card listing">
          <div class="searchbar">
            <input id="search" type="search" placeholder="기능 검색 (제목 / 번호)">
          </div>
          <div class="tablewrap">
            <table>
              <thead><tr><th>기능</th><th>상태</th><th class="col-who">담당</th><th>PR</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </section>
        <article class="card detail" id="detail"><p class="empty">왼쪽 목록에서 기능을 선택하세요.</p></article>
      </div>
    </section>
    <section id="view-prd" hidden><article class="card doc" id="prd"></article></section>
    <section id="view-guide" hidden><article class="card doc" id="guide"></article></section>
  </main>

  <footer id="foot"></footer>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
